name: Update migration definitions

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out brew2port
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate definitions database
        run: >-
          python -m brew2port build-definitions
          --output definitions/mappings.json
          --cache /tmp/macports-ports.json
          --refresh-ports
      - name: Publish changed definitions
        run: |
          if git diff --quiet -- definitions/mappings.json; then
            echo "Definitions are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add definitions/mappings.json
          git commit -m "Refresh published migration definitions"
          git push
