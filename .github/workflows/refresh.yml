name: refresh-catalog
on:
  workflow_dispatch:
  schedule: [{cron: '17 4 * * 1'}]
permissions: {contents: write, pages: write, id-token: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Fetch source snapshots
        run: PYTHONPATH=. python -m macpkg_catalog fetch-live --output snapshots/catalog.json
      - name: Build catalog
        run: PYTHONPATH=. python -m macpkg_catalog generate --input snapshots/catalog.json --output build/catalog
      - name: Validate tests
        run: PYTHONPATH=. python -m pytest -q
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: build/catalog}
      - uses: actions/deploy-pages@v4
