[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "macpkgmap"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6"]
[project.scripts]
macpkgmap = "macpkg_catalog.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["macpkg_catalog*"]
